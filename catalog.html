<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Hermanos Jota</title>
  <link rel="stylesheet" href="styles/global.css">
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
</head>

<body>

  <header class="main-header">
    <div class="container header-content">
      <a href="index.html" class="logo">
        <h1 id="title">Hermanos Jota</h1>
      </a>

      <nav class="main-nav" aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="catalog.html" class="active" aria-current="page">Catálogo</a></li>
          <li><a href="contact.html">Contacto</a></li>
        </ul>
      </nav>

      <div class="cart-status">
        <a href="cart.html" id="cart-btn" aria-label="Ver carrito de compras">
          <img src="assets/images/shopping-cart.png" alt="Carrito" class="cart-icon">
          <span id="cart-counter" class="badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container main-section">
    <h2 class="section-title">Nuestros Muebles</h2>

    <div class="catalog-tools">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar muebles por nombre...">

      <select id="category-filter" class="filter-select">
        <option value="all">Todas las categorías</option>
        <option value="Sillas">Sillas</option>
        <option value="Mesas">Mesas</option>
        <option value="Sillones">Sillones</option>
        <option value="Muebles">Muebles de Guardado</option>
      </select>
    </div>

    <div id="catalog-container" class="products-grid" aria-live="polite"></div>
  </main>

  <footer class="main-footer">
    <div class="container footer-content">
      <div class="footer-col">
        <h3>Hermanos Jota</h3>
        <p>Calidad y confort en cada rincón.</p>
      </div>

      <div class="footer-col">
        <h4>Navegación</h4>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="catalog.html">Catálogo</a></li>
          <li><a href="contact.html">Contacto</a></li>
        </ul>
      </div>

      <div class="footer-col">
        <h4>Contacto</h4>
        <p>Av. Corrientes 1234, CABA</p>
        <p id="email">contacto@hermanosjota.com</p>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; <span id="year">2026</span> Mueblería Hermanos Jota. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="scripts/catalog.js" defer></script>
</body>

</html>
