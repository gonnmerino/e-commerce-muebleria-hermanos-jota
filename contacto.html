<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mueblería Hermanos Jota</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Hermanos Jota</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Catálogo</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="cart">
            <span>Carrito: <span id="contador-carrito">0</span></span>
        </div>
    </header>

    <main>
        <section class="contact-section">
            <h2>Ponete en contacto con nosotros</h2>
            <p>Completá el formulario y te responderemos a la brevedad.</p>

            <form id="form-section">
                <div class="input-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre">
                </div>

                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                </div>

                <div class="input-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribí tu consulta acá"></textarea>
                </div>

                <button type="submit" id="btn-enviar">Enviar Mensaje</button>
            </form>

            <div id="mensaje-exito" class="oculto"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mueblería Hermanos Jota. Todos los derechos reservados.</p>
    </footer>

    <script src="contacto.js"></script>
</body>
</html>
